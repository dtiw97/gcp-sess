<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TBM Dummy Console</title>
  <!-- Dummy frontend: React from a CDN + in-browser JSX (no build step). Not for production. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2330; --muted:#6b7280; --ok:#15803d; --bad:#b91c1c; --line:#e5e7eb; --accent:#2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --card:#181b22; --fg:#e6e8ee; --muted:#9aa1ad; --ok:#4ade80; --bad:#f87171; --line:#2a2f3a; --accent:#60a5fa; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
    main { max-width:640px; margin:32px auto; padding:0 16px; }
    h1 { font-size:20px; margin:0 0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
    .label { color:var(--muted); font-size:13px; }
    .big { font-size:28px; font-variant-numeric:tabular-nums; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    input[type=range] { width:100%; accent-color:var(--accent); }
    button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; }
    pre { margin:0; font-size:12px; white-space:pre-wrap; word-break:break-all; color:var(--muted); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    // Same host as the page, so the Upgrader's origin check passes.
    const wsUrl = (id) => `ws://${location.host}/sessions/${id}/ws`;

    // The session id lives in the URL (?session=…, so a link or a refresh brings you
    // back) and in localStorage (so opening /ui again resumes your last session).
    function readSessionId() {
      const fromUrl = new URLSearchParams(location.search).get("session");
      if (fromUrl) return fromUrl;
      try { return localStorage.getItem("session") || ""; } catch { return ""; }
    }
    function rememberSessionId(id) {
      const url = new URL(location.href);
      if (id) url.searchParams.set("session", id); else url.searchParams.delete("session");
      history.replaceState(null, "", url);
      try { id ? localStorage.setItem("session", id) : localStorage.removeItem("session"); } catch {}
    }

    // Picker: create a new session or go back to an existing one (GET /sessions).
    function Picker({ onPick, error }) {
      const [list, setList] = useState(null);
      const [busy, setBusy] = useState(false);
      useEffect(() => {
        fetch("/sessions").then(r => r.json()).then(setList).catch(() => setList([]));
      }, []);
      async function create() {
        setBusy(true);
        const r = await fetch("/sessions", { method: "POST" });
        setBusy(false);
        if (r.ok) onPick((await r.json()).id);
      }
      return (
        <main>
          <h1>TBM dummy console</h1>
          {error && <div className="card" style={{ color: "var(--bad)" }}>{error}</div>}
          <div className="card row">
            <span>Start a fresh machine</span>
            <button onClick={create} disabled={busy}>New session</button>
          </div>
          <div className="card">
            <div className="label">Previous sessions (saved every 3 s; one live at a time)</div>
            {list === null && <div className="label">loading…</div>}
            {list && list.length === 0 && <div className="label">none yet</div>}
            {list && list.map(s => (
              <div key={s.id} className="row" style={{ padding: "6px 0", borderTop: "1px solid var(--line)" }}>
                <div>
                  <div style={{ fontFamily: "monospace" }}>{s.id}</div>
                  <div className="label">
                    distance {s.state.output.distance.toFixed(1)} mm · pot {s.state.input.potty_value} · saved {new Date(s.updated_at).toLocaleTimeString()}
                  </div>
                </div>
                <button onClick={() => onPick(s.id)}>Resume</button>
              </div>
            ))}
          </div>
        </main>
      );
    }

    function App() {
      const [sessionId, setSessionId] = useState(readSessionId);
      const [error, setError] = useState("");
      function pick(id) { setError(""); rememberSessionId(id); setSessionId(id); }
      function leave(msg) { setError(msg || ""); rememberSessionId(""); setSessionId(""); }
      if (!sessionId) return <Picker onPick={pick} error={error} />;
      // key: a different session id mounts a fresh Console (new socket, fresh state).
      return <Console key={sessionId} sessionId={sessionId} onLeave={leave} />;
    }

    function Console({ sessionId, onLeave }) {
      const WS_URL = wsUrl(sessionId);
      const wsRef = useRef(null);
      const [status, setStatus] = useState("connecting"); // connecting | open | closed
      const [closeInfo, setCloseInfo] = useState("");
      const [pot, setPot] = useState(0);
      const [state, setState] = useState(null); // latest machine.State from the server
      const [rate, setRate] = useState(0);      // states received per second
      const countRef = useRef(0);

      function connect() {
        setStatus("connecting");
        setCloseInfo("");
        const ws = new WebSocket(WS_URL);
        wsRef.current = ws;
        let opened = false, first = true;
        ws.onopen = () => { opened = true; setStatus("open"); };
        ws.onmessage = (e) => {
          let msg;
          try { msg = JSON.parse(e.data); } catch { return; }
          if (!msg.output) return; // not a machine state (e.g. a relayed raw input)
          countRef.current++;
          setState(msg);
          // Resuming: start the slider where the saved session left it.
          if (first) { first = false; setPot(msg.input.potty_value); }
        };
        ws.onclose = (e) => {
          // Never opened: the upgrade was refused (409 busy, 503 shutting down). The browser
          // hides the HTTP status and only reports 1006, so go back to the picker with a hint.
          if (!opened) { onLeave("Could not join: the room is probably hosting another session with clients connected."); return; }
          setStatus("closed");
          setCloseInfo(`code ${e.code}${e.reason ? ` "${e.reason}"` : ""}, clean=${e.wasClean}`);
        };
      }

      useEffect(() => {
        // Check the session exists first: a failed upgrade (404) only shows up as code 1006.
        fetch(`/sessions/${sessionId}`).then(r => {
          if (r.status === 404) onLeave(`Session ${sessionId} not found.`);
          else connect();
        }).catch(() => connect());
        const t = setInterval(() => { setRate(countRef.current); countRef.current = 0; }, 1000);
        return () => { clearInterval(t); wsRef.current?.close(); };
      }, []);

      // Send the pot position as a machine.Input. The server applies it on the next tick.
      function onPot(e) {
        const v = Number(e.target.value);
        setPot(v);
        const ws = wsRef.current;
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ potty_value: v }));
        }
      }

      const color = status === "open" ? "var(--ok)" : status === "closed" ? "var(--bad)" : "var(--muted)";
      const out = state?.output;

      return (
        <main>
          <h1>TBM dummy console</h1>

          <div className="card row">
            <div><div className="label">Session</div><div style={{ fontFamily: "monospace" }}>{sessionId}</div></div>
            <button onClick={() => { wsRef.current?.close(); onLeave(); }}>Switch session</button>
          </div>

          <div className="card row">
            <div><span className="dot" style={{ background: color }} />{status} <span className="label">{WS_URL}</span></div>
            {status === "closed" && <button onClick={connect}>Reconnect</button>}
          </div>
          {closeInfo && <div className="card label">Closed: {closeInfo}</div>}

          <div className="card">
            <div className="row"><span>Speed pot (potty_value)</span><span className="big">{pot}</span></div>
            <input type="range" min="0" max="100" step="1" value={pot} onChange={onPot} disabled={status !== "open"} />
            <div className="label">Sent as {"{"}"potty_value": {pot}{"}"}; the server applies it on the next 50 ms tick.</div>
          </div>

          <div className="card grid">
            <div><div className="label">Speed (mm/s)</div><div className="big">{out ? out.speed.toFixed(1) : "–"}</div></div>
            <div><div className="label">Distance (mm)</div><div className="big">{out ? out.distance.toFixed(1) : "–"}</div></div>
            <div><div className="label">Server's input</div><div className="big">{state ? state.input.potty_value : "–"}</div></div>
            <div><div className="label">States / second</div><div className="big">{rate}</div></div>
          </div>

          <div className="card">
            <div className="label">Last state (raw)</div>
            <pre>{state ? JSON.stringify(state) : "waiting…"}</pre>
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
